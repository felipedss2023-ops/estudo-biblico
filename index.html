<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudo Bíblico</title>
<meta name="theme-color" content="#1C2333">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

if(!/^https?:$/.test(location.protocol))location.replace('http://localhost:8080/');</script>
<script>try{var t0=localStorage.getItem('tema');if(t0&&t0!=='auto')document.documentElement.setAttribute('data-theme',t0)}catch(e){}</script>
<style>
:root{--bg:#FAF6EC;--card:#FFFDF7;--bg2:#F1EAD8;--ink:#2B2620;--mute:#6b6455;--line:#DDD3BC;--acc:#A9812F;--acc2:#cba658;--onacc:#201803;--cover:#1C2333;--cover2:#262f45;--onc:#EFE7D0;--onc2:#b9b19a;--bad:#7A2E2E;--ok:#3d6b4f;--sh:0 1px 2px rgba(28,35,51,.05),0 4px 14px rgba(28,35,51,.06);--serif:Lora,Georgia,'Times New Roman',serif;--sans:'Work Sans',-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#171A22;--card:#1E222D;--bg2:#262b38;--ink:#E7E2D3;--mute:#9A9484;--line:#333a4a;--acc:#c29a45;--acc2:#cba658;--onacc:#1a1406;--cover:#0F131C;--cover2:#171E2C;--bad:#d58f8f;--ok:#7fbf98;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171A22;--card:#1E222D;--bg2:#262b38;--ink:#E7E2D3;--mute:#9A9484;--line:#333a4a;--acc:#c29a45;--acc2:#cba658;--onacc:#1a1406;--cover:#0F131C;--cover2:#171E2C;--bad:#d58f8f;--ok:#7fbf98;--sh:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
:root[data-theme="sepia"]{--bg:#F4ECD8;--card:#F9F2E2;--bg2:#EADFC0;--ink:#4B3621;--mute:#8a7455;--line:#ddcda0;--acc:#8a6a2f;--acc2:#a5813f;--onacc:#fff8e8;--cover:#3b2f1e;--cover2:#4a3c26;--bad:#8a3a2a}
:root[data-theme="oled"]{--bg:#000;--card:#0a0a0a;--bg2:#141414;--ink:#e8e8e8;--mute:#999;--line:#222;--acc:#b8902f;--acc2:#cba658;--onacc:#1a1406;--cover:#000;--cover2:#050505;--bad:#d58f8f;--ok:#7fbf98;--sh:none;color-scheme:dark}
html{scroll-padding-top:80px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
main{padding-top:14px}
header.top{position:sticky;top:0;z-index:7;background:linear-gradient(180deg,var(--cover),var(--cover2));color:var(--onc);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
.hd{display:flex;align-items:center;gap:10px;padding-top:11px;padding-bottom:11px}
.logo{flex:1;font-family:var(--serif);font-size:1.3rem;cursor:pointer;letter-spacing:.2px;white-space:nowrap}.logo em{color:var(--acc2)}
.sync{font-size:.75rem;color:var(--onc2);text-align:right}
.hbtn{background:transparent;border:1px solid #3a415a;color:var(--onc);border-radius:999px;width:36px;height:36px;font-size:1rem;cursor:pointer;flex:none}
.hbtn:hover{border-color:var(--acc2)}
.smenu{display:none;position:fixed;right:12px;top:calc(62px + env(safe-area-inset-top,0px));z-index:9;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3);padding:12px;width:min(310px,calc(100vw - 24px))}
.smenu.show{display:block}
.smenu .lb{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:700;margin:4px 0 6px}
.smenu .mb{display:block;width:100%;text-align:left;margin:0 0 6px}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:var(--onacc);border:1px solid var(--acc);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:.9rem;transition:transform .12s,background .12s,border-color .12s}
.btn:hover{background:var(--acc2);border-color:var(--acc2)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:default}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.ghost:hover{background:transparent;border-color:var(--acc)}
.danger{color:var(--bad)}.danger:hover{border-color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh)}
h3{margin:.1em 0 .7em;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:700}
.books{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:.86rem;font-weight:500;user-select:none;transition:all .12s}
.chip:hover{border-color:var(--acc)}.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
.chip.sm{padding:3px 9px;font-size:.78rem}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}.nums .chip{text-align:center;border-radius:12px;padding:8px 0}
input,textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:4px 0;outline:none;transition:border-color .12s}
input:focus,textarea:focus,select:focus,.rte:focus{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 25%,transparent)}
input[type=checkbox]{width:auto;margin:0 6px 0 0;accent-color:var(--acc)}
input[type=range]{accent-color:var(--acc);padding:0;border:0;background:none;box-shadow:none}
textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item small,.tag{color:var(--mute);font-size:.82rem}
.lbl{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;margin:10px 0 0}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ct{font-family:var(--serif);font-size:1.08rem;font-weight:600}
.cref{color:var(--acc);font-weight:600;font-size:.85rem}
.cc{font-size:.92rem;margin-top:6px;overflow-wrap:anywhere}
.ca{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ca .btn{padding:6px 11px;font-size:.84rem}
.vauto{font-family:var(--serif);font-style:italic;font-size:.88rem;color:var(--mute);margin:3px 0;line-height:1.45}
.vauto:empty{display:none}
.pprev{margin-top:6px;font-size:.92rem}
.lic{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.lic.hoje{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 22%,transparent)}
.lich{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
.licn{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--acc)}
.licd{font-size:.8rem;color:var(--mute)}.licok{margin-left:auto;font-size:.75rem;color:var(--ok);font-weight:600}
.bar{background:var(--bg2);border-radius:99px;height:9px;overflow:hidden}.bar div{background:var(--acc);height:9px;border-radius:99px}
/* editor com formatação */
.rtebar{display:flex;gap:5px;align-items:center;flex-wrap:wrap;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:3;background:var(--card);padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:4px}
.rtebar .btn{padding:4px 10px;min-width:34px}
.rtebar input[type=color]{width:36px;height:32px;padding:2px;margin:0;cursor:pointer}
.rte{min-height:90px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:4px 0;background:var(--bg);outline:none;line-height:1.55;overflow-wrap:anywhere}
.rte.sm{min-height:46px}
.rte:empty:before{content:attr(data-ph);color:var(--mute)}
.rt b,.rt strong{font-weight:700}
.pt{display:flex;gap:6px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg2);margin:6px 0}
.pn{font-family:var(--serif);color:var(--acc);min-width:20px;padding-top:12px;text-align:right}
.pf{flex:1;min-width:0}.pf input{margin:2px 0}.pf .pr{font-size:.82rem;padding:6px 9px}
/* início */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:26px 22px 22px;margin:4px 0 6px;background:linear-gradient(145deg,var(--cover2),var(--cover));color:var(--onc);border:1px solid rgba(255,255,255,.07);box-shadow:0 18px 40px -18px rgba(28,35,51,.6)}
.hero:before{content:'';position:absolute;right:-90px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(203,166,88,.32),transparent 65%);pointer-events:none}
.hero:after{content:'';position:absolute;left:-70px;bottom:-130px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(120,140,200,.16),transparent 65%);pointer-events:none}
.hero>*{position:relative}
.hdate{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc2);font-weight:600}
.htitle{font-family:var(--serif);font-size:clamp(1.9rem,6vw,2.5rem);line-height:1.1;margin:6px 0 4px}
.hsub{margin:0 0 18px;color:var(--onc2);font-size:.92rem}
.vod{min-height:150px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px 20px 14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.vodr{display:flex;align-items:center;gap:8px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--onc2);font-weight:600;margin-bottom:4px}
.vodr:before{content:'';width:18px;height:2px;background:var(--acc2);border-radius:2px}
.vodt{font-family:var(--serif);font-size:clamp(1.12rem,3.6vw,1.35rem);line-height:1.55;color:#F6F0DF}
.vodt:before{content:'“';display:block;font-size:2.8em;line-height:1;height:.5em;color:var(--acc2)}
.vodf{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}
.vodf b{color:var(--acc2);font-size:.9rem}.vodf small{color:var(--onc2);font-size:.78rem}
.pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:var(--onc);border-radius:999px;padding:6px 13px;font-size:.78rem;cursor:pointer;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--acc2);background:rgba(203,166,88,.12)}
.sec{margin:24px 2px 10px;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.feat,.plan{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);color:var(--ink);transition:transform .15s,border-color .15s}
.feat{display:flex;gap:14px;align-items:center;padding:16px;cursor:pointer;text-align:left;width:100%}
.feat:hover{transform:translateY(-2px);border-color:var(--acc)}
.ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.35rem;background:color-mix(in srgb,var(--hue,var(--acc)) 18%,transparent)}
.fx{flex:1;min-width:0}
.feat small,.plan small{display:block;color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.feat b,.plan b{display:block;font-family:var(--serif);font-size:1.08rem;font-weight:600;margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat .bar,.feat .bar div{height:6px}
.chev{color:var(--mute);font-size:1.4rem;line-height:1}
.plan{display:flex;gap:14px;align-items:center;padding:14px 16px}
.plan .fx{cursor:pointer}.plan b{margin-bottom:0;white-space:normal}
.ring{width:50px;height:50px;flex:none;border-radius:50%;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bg2) 0);display:grid;place-items:center}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:.7rem;font-weight:700}
.chk{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--line);background:transparent;color:var(--mute);cursor:pointer;font-size:1rem;font-weight:700;transition:all .15s}
.chk:hover{border-color:var(--ok);color:var(--ok)}.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}/* leitura */
#txt{font-family:var(--serif)}
.vr{margin:.1em 0;padding:4px 6px;border-radius:6px;cursor:pointer}
.vr:hover{background:var(--bg2)}
.vr.sel{background:var(--bg2);box-shadow:inset 3px 0 0 var(--acc)}
.vn{font-family:var(--serif);color:var(--acc);font-size:.72em;font-weight:600;margin-right:2px}
.mk{font-size:.68em}
.par .vr{display:inline;padding:1px 0;margin:0}.par .vn{vertical-align:super;font-size:.6em}
.vhl{background:color-mix(in srgb,var(--acc2) 30%,transparent)!important}
.selbar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;width:min(860px,calc(100vw - 24px));background:var(--acc);color:var(--onacc);padding:8px 10px;border-radius:12px;gap:6px;align-items:center;flex-wrap:wrap;font-size:.86rem;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.selbar.show{display:flex}.selbar span{flex:1;min-width:110px}
.selbar button{background:#201803;color:#f2e6c8;border:0;border-radius:7px;padding:6px 10px;font-size:.82rem;cursor:pointer}
.bres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh);transition:border-color .15s}
.bres:hover{border-color:var(--acc)}.bres .bt{font-family:var(--serif);margin-top:2px;line-height:1.55}
mark{background:color-mix(in srgb,var(--acc2) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.pdia{display:flex;gap:12px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line);border-radius:10px}
.pdia:last-child{border-bottom:0}.pdia.hoje{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.pdia .chk{width:34px;height:34px;font-size:.9rem}.pdia.lido .fx{opacity:.5}
.pdia .fx{cursor:pointer;min-width:0}.pdia small{display:block;color:var(--mute);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.pdia b{font-family:var(--serif);font-weight:600}.atr{color:var(--bad)}
.pdia.flash{animation:pfl 1.6s ease}@keyframes pfl{0%,60%{box-shadow:0 0 0 2px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.lv{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;max-height:190px;overflow:auto}
.panes{display:grid;grid-template-columns:repeat(var(--n),minmax(280px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh);min-width:0}
.panehd{background:var(--bg2);padding:8px}.panehd select,.panehd input{margin:3px 0}
.panetx{font-family:var(--serif);padding:12px 14px;max-height:70vh;overflow:auto}
/* barra inferior */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:4px;padding:8px calc(12px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));background:var(--cover);border-top:1px solid #333c54}
#nav button{flex:1;max-width:120px;background:none;border:0;border-radius:12px;padding:6px 4px;font-size:.72rem;font-weight:600;color:var(--onc2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#nav button span{font-size:1.2rem}#nav button.on{color:var(--acc2);background:rgba(203,166,88,.14)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:90vw;background:var(--cover);color:var(--onc);padding:10px 18px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:all .25s;z-index:60;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* apresentação */
.pres{position:fixed;inset:0;background:var(--cover);z-index:50;display:none;flex-direction:column;color:#EFE7D0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.pres.show{display:flex}
.ptop{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;font-size:.84rem;color:#b9b19a}
.pclose{background:transparent;border:0;color:#EFE7D0;font-size:1rem;padding:6px 10px;border-radius:8px;cursor:pointer}.pclose:hover{background:rgba(255,255,255,.08)}
.pbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:16px clamp(18px,6vw,60px);overflow-y:auto}
.pe{font-size:calc(15px * var(--eb-scale,1));letter-spacing:.08em;text-transform:uppercase;color:#cba658;margin-bottom:18px}
.ph{font-family:var(--eb-font,var(--serif));font-size:calc(clamp(28px,6vw,44px) * var(--eb-scale,1));font-weight:600;margin-bottom:20px;line-height:1.2}
.pr2{font-size:calc(18px * var(--eb-scale,1));color:#cba658;margin-bottom:20px}
.ptx{font-family:var(--eb-font,var(--serif));font-size:calc(clamp(19px,3.4vw,24px) * var(--eb-scale,1));line-height:1.6;max-width:900px}
.pv2{font-family:var(--serif);font-style:italic;font-size:calc(clamp(17px,2.8vw,20px) * var(--eb-scale,1));color:#d8cfb4;max-width:850px;margin-top:24px;line-height:1.55}
.pbot{display:flex;justify-content:center;gap:16px;padding:16px}
.pbot button{background:transparent;border:1px solid #3a415a;color:#EFE7D0;border-radius:999px;padding:9px 20px;font-size:.88rem;cursor:pointer}
.pbot button:hover{border-color:#cba658}.pbot button:disabled{opacity:.35;cursor:default}
/* prévia do PDF */
#pv{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));align-items:center;justify-content:center}
#pv.show{display:flex}
.pvbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;width:min(860px,100%);height:100%;display:flex;flex-direction:column}
.pvp{flex:1;overflow:auto;background:#5b5b5b;border-radius:8px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:12px}
.pvp canvas{max-width:100%;height:auto!important;box-shadow:0 2px 10px rgba(0,0,0,.4);background:#fff}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
</style>
</head>
<body>
<header class="top"><div class="wrap hd">
  <button id="voltar" class="hbtn" onclick="voltar()" title="Voltar" style="display:none">←</button>
  <div class="logo" onclick="go('home')">Estudo <em>Bíblico</em></div>
  <span id="sync" class="sync" onclick="if(cfgOk()&&!LS.getItem('estudo_codigo'))pedeCodigo(event)" style="cursor:pointer">Somente local</span>
  <button class="hbtn" onclick="togMenu(event)" title="Configurações" style="position:relative">⚙<span id="bkdot" title="Backup precisa de atenção" style="display:none;position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--acc2)"></span></button>
</div></header>

<div class="wrap"><main id="app"></main></div>

<script>
/* localStorage pode estar bloqueado (ex.: arquivo aberto direto, navegação privada): nesse caso guarda em memória */
var LS=(function(){try{var s=window.localStorage;s.getItem('x');return s}catch(e){var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=String(v)},removeItem:function(k){delete m[k]}}}})();
function toast(m){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.className='show';clearTimeout(t._h);t._h=setTimeout(function(){t.className=''},4000)}
window.addEventListener('error',function(e){console.error(e.error||e.message);toast('Algo deu errado. Se persistir, recarregue a página.')});
window.addEventListener('unhandledrejection',function(e){console.error(e.reason);toast('Não foi possível concluir a operação.')});
var OT=[["Gênesis",50],["Êxodo",40],["Levítico",27],["Números",36],["Deuteronômio",34],["Josué",24],["Juízes",21],["Rute",4],["1 Samuel",31],["2 Samuel",24],["1 Reis",22],["2 Reis",25],["1 Crônicas",29],["2 Crônicas",36],["Esdras",10],["Neemias",13],["Ester",10],["Jó",42],["Salmos",150],["Provérbios",31],["Eclesiastes",12],["Cantares",8],["Isaías",66],["Jeremias",52],["Lamentações",5],["Ezequiel",48],["Daniel",12],["Oseias",14],["Joel",3],["Amós",9],["Obadias",1],["Jonas",4],["Miqueias",7],["Naum",3],["Habacuque",3],["Sofonias",3],["Ageu",2],["Zacarias",14],["Malaquias",4]];
var NT=[["Mateus",28],["Marcos",16],["Lucas",24],["João",21],["Atos",28],["Romanos",16],["1 Coríntios",16],["2 Coríntios",13],["Gálatas",6],["Efésios",6],["Filipenses",4],["Colossenses",4],["1 Tessalonicenses",5],["2 Tessalonicenses",3],["1 Timóteo",6],["2 Timóteo",4],["Tito",3],["Filemom",1],["Hebreus",13],["Tiago",5],["1 Pedro",5],["2 Pedro",3],["1 João",5],["2 João",1],["3 João",1],["Judas",1],["Apocalipse",22]];
var ALL=OT.concat(NT);
var app=document.getElementById('app');
var S={book:null,chap:null,edit:null};

function base(){return{notes:{},esbocos:[],ebd:[],fav:[],anot:[],plano:{},planos:[],trim:{},vdel:[],marc:[],saud:[],ebdprof:{},ebdtri:[],ebdocul:[]}}
var DATA=base(),META={dirty:false},tm=null;
try{var raw=JSON.parse(LS.getItem('estudo'));if(raw)DATA=Object.assign(DATA,raw);var m=JSON.parse(LS.getItem('estudo_meta'));if(m)META=m}catch(e){}
function persistLocal(){try{LS.setItem('estudo',JSON.stringify(DATA));LS.setItem('estudo_meta',JSON.stringify(META))}catch(e){}}
function load(k){return DATA[k]}
function save(k,v){DATA[k]=v;META.dirty=true;persistLocal();clearTimeout(tm);tm=setTimeout(push,600);agendaBackup()}
function setStatus(t){document.getElementById('sync').textContent=t}
function cfgOk(){return typeof CONFIG!=='undefined'&&CONFIG.SUPABASE_URL.indexOf('http')===0&&CONFIG.SUPABASE_KEY.length>20}
function code(){return LS.getItem('estudo_codigo')}
/* Conectar à nuvem: o código é digitado num campo do app (o painel/alguns navegadores não mostram prompt()) e conferido no Supabase antes de ser guardado */
function pedeCodigo(e){if(e)e.stopPropagation();var m=document.getElementById('menu');m.classList.add('show');drawMenu();var i=document.getElementById('cod');if(i)i.focus()}
function conecta(){var i=document.getElementById('cod'),c=i&&i.value.trim();if(!c){toast('Digite o código de acesso.');return}
  setStatus('Conectando…');rpc('estudo_ler',{codigo:c}).then(function(){LS.setItem('estudo_codigo',c);document.getElementById('menu').classList.remove('show');toast('Conectado à nuvem. Sincronizando…');pull();if(view==='home')home()})
   .catch(function(err){if(/codigo_invalido/.test(err.message)){setStatus('☁ Toque para conectar');toast('Código incorreto. Confira e tente de novo.')}else{setStatus('Offline');toast('Sem conexão com a nuvem agora. Tente de novo em instantes.')}})}
function rpc(fn,body){
  var h={'apikey':CONFIG.SUPABASE_KEY,'Content-Type':'application/json'};
  if(CONFIG.SUPABASE_KEY.indexOf('eyJ')===0)h['Authorization']='Bearer '+CONFIG.SUPABASE_KEY;
  return fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body)})
   .then(function(r){return r.text().then(function(t){var j=null;try{j=t?JSON.parse(t):null}catch(e){}if(!r.ok)throw new Error(j&&j.message||'erro');return j})})}
function bad(e){if(/codigo_invalido/.test(e.message)){LS.removeItem('estudo_codigo');setStatus('☁ Toque para conectar');toast('O código de acesso não confere. Conecte de novo no ⚙.')}else setStatus('Offline — salvo neste aparelho')}
function push(){if(!cfgOk())return;var c=code();if(!c)return;setStatus('Salvando…');
  return rpc('estudo_gravar',{codigo:c,novos:DATA}).then(function(){META.dirty=false;persistLocal();setStatus('☁ Sincronizado')}).catch(bad)}
function pull(){
  if(!cfgOk()){setStatus('Somente local');return}
  var c=code();if(!c){setStatus('☁ Toque para conectar');return}
  if(META.dirty){push().then(syncVers);return}
  rpc('estudo_ler',{codigo:c}).then(function(r){
    var d=r.dados||{},has=d.notes||d.esbocos||d.ebd;
    if(has){var old=JSON.stringify(DATA);DATA=Object.assign(base(),d);persistLocal();if(old!==JSON.stringify(DATA))agendaBackup();
      var a=document.activeElement;if(old!==JSON.stringify(DATA)&&S.edit===null&&!S.novo&&!S.ed&&!(a&&(/INPUT|TEXTAREA|SELECT/.test(a.tagName)||a.isContentEditable)))render()}
    else if(DATA.esbocos.length||DATA.ebd.length||Object.keys(DATA.notes).length){push().then(syncVers);return}
    setStatus('☁ Sincronizado');syncVers()}).catch(bad)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

/* Tema, menu de configurações e backup */
function tema(){try{return LS.getItem('tema')||'auto'}catch(e){return 'auto'}}
function aplicaTema(){var t=tema(),r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t)}
function setTema(t){try{LS.setItem('tema',t)}catch(e){}aplicaTema();drawMenu()}
function togMenu(e){e.stopPropagation();var m=document.getElementById('menu');if(m.classList.toggle('show'))drawMenu()}
document.addEventListener('click',function(){document.getElementById('menu').classList.remove('show')});
function drawMenu(){var t=tema();document.getElementById('menu').innerHTML='<span class="lb">Tema</span><div class="books" style="margin-bottom:12px">'+
  [['auto','Automático'],['light','Claro'],['sepia','Sépia'],['dark','Escuro'],['oled','OLED preto']].map(function(x){return '<div class="chip sm'+(t===x[0]?' on':'')+'" onclick="setTema(\''+x[0]+'\')">'+x[1]+'</div>'}).join('')+'</div>'+
  '<span class="lb">Dados (backup)</span><button class="btn ghost mb" onclick="exportar()">💾 Exportar dados</button><button class="btn ghost mb" onclick="document.getElementById(\'bkf\').click()">📂 Importar backup</button><input id="bkf" type="file" accept=".json,application/json" style="display:none" onchange="importar(this)">'+
  '<p class="tag" style="margin:0">Aceita também o backup do app antigo (“Estudo Bíblico offline”).</p>'+menuBackup()+
  '<span class="lb" style="margin-top:12px">Sobre e créditos</span>'+(S.mcred?'<div id="mcred" class="tag" style="line-height:1.5;margin-bottom:6px"><b style="color:var(--ink)">'+esc(JFAAL.completo)+' (JFAAL)</b><br>'+credCompleto()+'</div>':'<button class="btn ghost mb" onclick="S.mcred=true;drawMenu()">ℹ Versão JFAAL — créditos e licença</button>')+
  (!cfgOk()?'':LS.getItem('estudo_codigo')?'<span class="lb" style="margin-top:12px">Nuvem</span><p class="tag" style="margin:0 0 6px">☁ Conectado: seus dados e versões ficam guardados na nuvem.</p><button class="btn ghost mb" onclick="trocaCodigo()">🔑 Desconectar / trocar código</button>':
   '<span class="lb" style="margin-top:12px">Conectar à nuvem</span><p class="tag" style="margin:0 0 6px">Digite o código de acesso que você definiu no Supabase.</p><div class="row" style="flex-wrap:nowrap"><input id="cod" type="password" autocomplete="current-password" placeholder="Código de acesso" onkeydown="if(event.key===\'Enter\')conecta()" style="flex:1;min-width:0;margin:0"><button class="btn" onclick="conecta()">Conectar</button></div>')}
function trocaCodigo(){if(!confirm('Desconectar este aparelho da nuvem? Os dados continuam salvos na nuvem e aqui.'))return;LS.removeItem('estudo_codigo');setStatus('☁ Toque para conectar');drawMenu()}
function saveBlob(b,fn){var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
function bkPayload(){var p={app:'estudo',versao:2,exportado:new Date().toISOString(),dados:DATA,prefs:{}};
  ['tema','leitura','esboco_prefs'].forEach(function(k){var x=LS.getItem(k);if(x!=null)p.prefs[k]=x});return p}
function exportar(){saveBlob(new Blob([JSON.stringify(bkPayload())],{type:'application/json'}),'estudo-biblico-backup-'+iso(new Date())+'.json');LS.setItem('ultimo_backup',new Date().toISOString());
  toast('Backup exportado (as versões da Bíblia não entram no backup).');bkPonto();drawMenu()}

/* Backup automático, independente da nuvem:
   (1) arquivo escolhido pelo usuário (Chrome/Edge no computador), regravado ~3 s depois de cada alteração;
   (2) uma cópia por dia guardada no próprio aparelho (IndexedDB, últimos 14 dias), que pode ser restaurada. */
var BKH=null,BKT=null,BKST='',FSOK=typeof window.showSaveFilePicker==='function';
function bkGet(k){return tx('backup','readonly',function(s){return s.get(k)}).then(function(r){return r?r.v:null}).catch(function(){return null})}
function bkPut(k,v){return tx('backup','readwrite',function(s){return s.put({id:k,v:v})}).catch(function(){})}
function bkDel(k){return tx('backup','readwrite',function(s){return s.delete(k)}).catch(function(){})}
function temDados(){var D=DATA;return !!(D.esbocos.length||D.ebd.length||D.anot.length||D.marc.length||D.saud.length||(D.planos||[]).length||(D.ebdtri||[]).length||Object.keys(D.notes||{}).length||Object.keys(D.ebdprof||{}).length||(D.plano&&D.plano.inicio))}
function agendaBackup(){clearTimeout(BKT);BKT=setTimeout(fazBackup,3000)}
function fazBackup(){var p=bkPayload();if(temDados())bkPut('snap-'+iso(new Date()),p).then(limpaSnaps);
  if(!BKH)return Promise.resolve();
  return BKH.queryPermission({mode:'readwrite'}).then(function(st){if(st!=='granted'){BKST='pausado';return}
    return BKH.createWritable().then(function(w){return w.write(JSON.stringify(p,null,1)).then(function(){return w.close()})}).then(function(){LS.setItem('ultimo_backup',new Date().toISOString());BKST='ok'})}).catch(function(){BKST='erro'}).then(bkPonto)}
function limpaSnaps(){return tx('backup','readonly',function(s){return s.getAllKeys()}).then(function(ks){(ks||[]).filter(function(k){return /^snap-/.test(k)}).sort().reverse().slice(14).forEach(bkDel)}).catch(function(){})}
function escolheArqBackup(){window.showSaveFilePicker({suggestedName:'estudo-biblico-backup.json',types:[{description:'Backup do Estudo Bíblico',accept:{'application/json':['.json']}}]})
  .then(function(h){BKH=h;return bkPut('arquivo',h)}).then(fazBackup).then(function(){toast('Backup automático ligado: '+BKH.name);drawMenu()})
  .catch(function(e){if(!e||e.name!=='AbortError')toast('Não foi possível usar esse arquivo.')})}
function reativaBackup(){if(!BKH)return;BKH.requestPermission({mode:'readwrite'}).then(function(st){if(st==='granted'){BKST='ok';return fazBackup().then(function(){toast('Backup automático reativado.')})}}).then(drawMenu).catch(function(){})}
function paraBackup(){if(!confirm('Parar o backup automático em arquivo? O arquivo já salvo continua no computador.'))return;BKH=null;BKST='';bkDel('arquivo');drawMenu();bkPonto()}
function quando(isoDH){var d=new Date(isoDH);return isNaN(d)?'':d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
function menuBackup(){var ult=LS.getItem('ultimo_backup');
  return '<span class="lb" style="margin-top:12px">Backup automático</span>'+
  (!FSOK?'<p class="tag" style="margin:0 0 6px">Neste navegador não dá para gravar num arquivo sozinho; use “Exportar dados” de vez em quando.</p>':
   BKH?'<p class="tag" style="margin:0 0 6px">📁 Gravando em <b>'+esc(BKH.name)+'</b>'+(BKST==='pausado'?' — <b class="atr">pausado</b>':'')+(ult?' · último: '+esc(quando(ult)):'')+'</p>'+
     (BKST==='pausado'?'<button class="btn mb" onclick="reativaBackup()">🔓 Reativar backup automático</button>':'')+'<button class="btn ghost mb" onclick="paraBackup()">Parar backup em arquivo</button>':
   '<p class="tag" style="margin:0 0 6px">Grava uma cópia dos seus dados num arquivo do computador a cada alteração.</p><button class="btn ghost mb" onclick="escolheArqBackup()">📁 Escolher arquivo de backup</button>')+
  '<button class="btn ghost mb" onclick="verSnaps()">🗂 Cópias diárias neste aparelho</button><div id="snaps"></div>'}
function verSnaps(){var box=document.getElementById('snaps');if(!box)return;
  tx('backup','readonly',function(s){return s.getAllKeys()}).then(function(ks){ks=(ks||[]).filter(function(k){return /^snap-/.test(k)}).sort().reverse();
    box.innerHTML=ks.length?ks.map(function(k){return '<div class="row" style="justify-content:space-between;flex-wrap:nowrap;padding:4px 0"><span class="tag">'+esc(fmtD(k.slice(5,15)))+(k.length>15?' (antes de restaurar)':'')+'</span><button class="btn ghost" style="padding:4px 10px" onclick="restauraSnap(\''+k+'\')">Restaurar</button></div>'}).join(''):'<p class="tag" style="margin:0 0 6px">Ainda não há cópias. Elas são criadas sozinhas, uma por dia, quando você usa o app.</p>'}).catch(function(){box.innerHTML=''})}
function restauraSnap(k){bkGet(k).then(function(p){if(!p||!p.dados)return;
  if(!confirm('Restaurar a cópia de '+fmtD(k.slice(5,15))+'? Os dados atuais serão substituídos por ela'+(LS.getItem('estudo_codigo')?' — também na nuvem e nos outros aparelhos':'')+'.'))return;
  bkPut('snap-'+iso(new Date())+'~antes',bkPayload()).then(function(){DATA=Object.assign(base(),p.dados);META.dirty=true;persistLocal();push();document.getElementById('menu').classList.remove('show');render();toast('Cópia de '+fmtD(k.slice(5,15))+' restaurada.')})})}
function bkIniciar(){bkGet('arquivo').then(function(h){if(h&&h.queryPermission){BKH=h;return h.queryPermission({mode:'readwrite'}).then(function(st){BKST=st==='granted'?'ok':'pausado'})}}).then(function(){setTimeout(fazBackup,5000);bkPonto()})}
/* Aviso discreto: só um pontinho no ⚙ quando o backup em arquivo está pausado ou faz mais de 7 dias sem backup */
function bkAlerta(){if(!temDados())return false;if(BKH)return BKST==='pausado';var u=LS.getItem('ultimo_backup');return !u||Date.now()-new Date(u)>7*864e5}
function bkPonto(){var p=document.getElementById('bkdot');if(p)p.style.display=bkAlerta()?'':'none'}
function importar(inp){var f=inp.files[0];inp.value='';if(!f)return;document.getElementById('menu').classList.remove('show');
  f.text().then(function(t){var j=JSON.parse(t),d=j&&j.app==='estudo'&&j.dados?j.dados:j&&j.collections?doAntigo(j.collections):null;
    if(!d){toast('Arquivo de backup não reconhecido.');return}
    if(!confirm('Importar este backup? Os itens dele serão somados aos que já existem aqui (nada é apagado).'))return;
    var n=mescla(d);if(j.prefs)Object.keys(j.prefs).forEach(function(k){try{if(LS.getItem(k)==null)LS.setItem(k,j.prefs[k])}catch(e){}});
    save('notes',DATA.notes);aplicaTema();render();toast(n?n+' item(ns) importado(s).':'Nada novo para importar.')}).catch(function(){toast('Não foi possível ler o backup.')})}
function mescla(d){var n=0;
  ['anot','marc','esbocos','ebd','planos','saud','fav','ebdtri'].forEach(function(k){var src=d[k];if(!Array.isArray(src)||!src.length)return;
    var cur=(DATA[k]||[]).slice(),seen={};cur.forEach(function(x){seen[x&&x.id?x.id:JSON.stringify(x)]=1});
    src.forEach(function(x){var key=x&&x.id?x.id:JSON.stringify(x);if(!seen[key]){seen[key]=1;cur.push(x);n++}});DATA[k]=cur});
  if(d.notes){var no=Object.assign({},DATA.notes);Object.keys(d.notes).forEach(function(k){if(!no[k]){no[k]=d.notes[k];n++}});DATA.notes=no}
  if(d.ebdprof){var ep=Object.assign({},DATA.ebdprof);Object.keys(d.ebdprof).forEach(function(k){if(!ep[k]){ep[k]=d.ebdprof[k];n++}});DATA.ebdprof=ep}
  if(d.plano&&d.plano.inicio&&!(DATA.plano&&DATA.plano.inicio)){DATA.plano=d.plano;n++}
  if(d.trim&&d.trim.inicio&&!(DATA.trim&&DATA.trim.inicio)){DATA.trim=d.trim;n++}
  return n}
/* Backup do app antigo: coleções no estilo {notes:[{id,data}],...}. Registros salvos em "colecao/ID" são edições do item ID. */
var OLDAB='gn ex lv nm dt js jz rt 1sm 2sm 1rs 2rs 1cr 2cr ed ne et job sl pv ec ct is jr lm ez dn os jl am ob jn mq na hc sf ag zc ml mt mc lc jo at rm 1co 2co gl ef fp cl 1ts 2ts 1tm 2tm tt fm hb tg 1pe 2pe 1jo 2jo 3jo jd ap'.split(' ');
function doAntigo(C){var col={};
  Object.keys(C).forEach(function(k){var p=k.split('/'),nm=p[0];col[nm]=col[nm]||{};(C[k]||[]).forEach(function(x){var id=x&&(x.id||p[1]);if(!id||!x.data)return;col[nm][id]=Object.assign(col[nm][id]||{},x.data)})});
  function L(nm){var o=col[nm]||{};return Object.keys(o).map(function(id){return Object.assign({_id:id},o[id])})}
  function dia(s){return String(s||'').slice(0,10)}
  var d={anot:[],marc:[],esbocos:[],saud:[],ebd:[],planos:[]};
  L('notes').forEach(function(n){var b=OLDAB.indexOf(n.book_abbrev);if(b<0||!n.chapter)return;var x={id:'old_'+n._id,b:b,c:+n.chapter,v:+n.verse_start||1,t:(n.title?n.title+'\n':'')+(n.content||''),d:dia(n.updated_at)};if(+n.verse_end>x.v)x.e=+n.verse_end;d.anot.push(x)});
  L('bookmarks').forEach(function(m){var b=OLDAB.indexOf(m.book_abbrev);if(b<0)return;d.marc.push({id:'old_'+m._id,b:b,c:+m.chapter,v:+m.verse||1,ver:m.version||'',l:m.label||'',d:dia(m.created_at)})});
  L('esbocos').forEach(function(e){d.esbocos.push({id:'old_'+e._id,t:e.title||'',r:e.main_ref||'',i:e.introducao||'',pts:(e.points||[]).map(function(p){return{s:p.subject||'',r:p.ref||'',h:p.text||'',sub:0}}),c:e.conclusion||'',u:e.updated_at||''})});
  L('saudacoes').forEach(function(s){d.saud.push({id:'old_'+s._id,t:s.title||'',h:s.content||'',u:s.updated_at||''})});
  L('ebd').forEach(function(l){d.ebd.push({id:'old_'+l._id,d:l.date||'',t:l.title||'',r:l.ref||'',n:l.content||'',ok:false})});
  L('planos').forEach(function(p){if(!p.schedule)return;var f={};(p.completed||[]).forEach(function(x,i){if(x)f[i+1]=true});
    d.planos.push({id:'old_'+p._id,nome:p.name||'Plano',inicio:p.start_date||iso(new Date()),feitos:f,dias:p.schedule.map(function(day){var A=(day||[]).map(function(r){return[OLDAB.indexOf(r.book),r.chapter]}).filter(function(r){return r[0]>=0});return rangeText(A,0,A.length)})})});
  return d}

/* Voltar: pilha das telas visitadas, ligada ao histórico do navegador (botão voltar do celular também funciona).
   Ida e volta para a mesma tela (ex.: lista → editor → lista ao salvar) desfaz o passo, para o voltar não reabrir o editor. */
var NAV=[],NAVR=false,NAVSKIP=0;
function navKey(){var k=view;
  if(view==='biblia')k+='|'+(S.bt||'ler')+(S.cmp?'|c':'')+(S.ed?'|a':'')+(S.novo?'|n':'');
  else if(view==='esboco')k+='|'+etAtual()+(S.imp?'|imp':'')+(S.ev!=null?'|v'+S.ev:'')+(S.sv!=null?'|s'+S.sv:'')+(S.edit!==null?'|e'+S.edit:'');
  else if(view==='ebd')k+='|'+clsAtual()+'|'+(S.tri||'')+(S.trf?'|f':'')+(S.edit!==null?'|e'+S.edit:'');
  return k}
function navSnap(){return{k:navKey(),v:view,bt:S.bt,et:S.et,eb:S.eb,edit:S.edit,ed:S.ed,novo:S.novo,cmp:S.cmp,book:S.book,chap:S.chap,verse:S.verse,pid:S.pid,pday:S.pday,tk:S.tk,tri:S.tri,cls:S.cls,trf:S.trf,imp:S.imp,ev:S.ev,sv:S.sv}}
function marca(){document.getElementById('voltar').style.display=view==='home'?'none':'';bkPonto();if(NAVR)return;var k=navKey(),n=NAV.length;

/* Referências bíblicas digitadas (ex.: "Jo 3:16-18") e o texto delas na versão ativa */
function bookIdx(s){s=String(s||'').trim().toLowerCase();if(!s)return -1;var c=s.replace(/\s+/g,''),n=norm(s),i;
  if((i=OLDAB.indexOf(c))>-1)return i;
  for(i=0;i<66;i++)if(norm(ALL[i][0])===n)return i;
  for(i=0;i<66;i++)if(ABR[i].toLowerCase()===c)return i;
  for(i=0;i<66;i++)if(norm(ABR[i])===n)return i;
  for(i=0;i<66;i++)if(n.length>2&&norm(ALL[i][0]).indexOf(n)===0)return i;
  return -1}
function parseRef(t){var m=String(t||'').trim().match(/^(.+?)\s*(\d+)\s*[:.,]\s*(\d+)(?:\s*[-–]\s*(\d+))?$/);if(!m)return null;var b=bookIdx(m[1]);if(b<0)return null;var v1=+m[3],v2=m[4]?+m[4]:v1;return{b:b,c:+m[2],v1:v1,v2:Math.min(Math.max(v1,v2),v1+29)}}
function refText(R){var id=verAtiva();if(!id||!R)return Promise.resolve(null);return getVers(id).then(function(L){var ch=L&&L[R.b]&&L[R.b][R.c-1];if(!ch)return null;var o=[];for(var k=R.v1;k<=R.v2&&k<=ch.length;k++)if(ch[k-1])o.push((R.v2>R.v1?k+' ':'')+ch[k-1]);return o.join(' ')||null}).catch(function(){return null})}

/* Busca por palavra ou frase, sem diferenciar maiúsculas e acentos ("graca" acha "graça").

var BR=null,BRK='',FOLD={};
function dobraR(s){s=String(s||'');var f=s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();if(f.length===s.length)return f;
  f='';for(var i=0;i<s.length;i++){var c=s.charAt(i).normalize('NFD').charAt(0).toLowerCase();f+=c.length===1?c:s.charAt(i)}return f}
function foldVers(id){if(FOLD[id])return Promise.resolve(FOLD[id]);return getVers(id).then(function(L){FOLD[id]=(L||[]).map(function(bk){return (bk||[]).map(function(ch){return (ch||[]).map(dobraR)})});return FOLD[id]})}

    (e?'':'<span class="row" style="flex-wrap:nowrap"><button class="btn ghost" title="Renomear" onclick="renVers(\''+m.id+'\')">✎</button><button class="btn ghost danger" title="Remover" onclick="delVers(\''+m.id+'\')">✕</button></span>')+'</div>'+
    (e?'<div class="tag" style="margin-top:8px;padding:10px 12px;background:var(--bg2);border-radius:8px;line-height:1.5">'+credCompleto()+'</div>':'')+'</div>'}).join(''):'<p class="tag">Nenhuma ainda.</p>')+'</div>'}
function setAtiva(id){S.va=id;biblia()}

/* Versículo do dia: só a referência é fixa; o texto vem da versão instalada */
var VD='Gênesis 1:1;Josué 1:9;Salmos 23:1;Salmos 27:1;Salmos 46:1;Salmos 91:1;Salmos 119:105;Salmos 121:2;Provérbios 3:5;Provérbios 3:6;Provérbios 16:3;Provérbios 22:6;Isaías 40:31;Isaías 41:10;Isaías 53:5;Jeremias 29:11;Jeremias 33:3;Lamentações 3:22;Miqueias 6:8;Naum 1:7;Habacuque 3:19;Sofonias 3:17;Eclesiastes 3:1;Deuteronômio 31:6;Êxodo 14:14;Números 6:24;1 Samuel 16:7;Jó 19:25;Mateus 5:16;Mateus 6:33;Mateus 7:7;Mateus 11:28;Mateus 28:20;Marcos 10:27;Lucas 1:37;Lucas 11:9;João 3:16;João 8:32;João 10:10;João 13:34;João 14:6;João 14:27;João 15:5;João 16:33;Atos 1:8;Romanos 5:8;Romanos 8:1;Romanos 8:28;Romanos 10:17;Romanos 12:2;1 Coríntios 10:13;1 Coríntios 13:13;2 Coríntios 5:17;2 Coríntios 12:9;Gálatas 2:20;Gálatas 5:22;Efésios 2:8;Efésios 6:10;Filipenses 4:6;Filipenses 4:7;Filipenses 4:13;Colossenses 3:23;1 Tessalonicenses 5:16;2 Timóteo 1:7;Hebreus 11:1;Hebreus 12:1;Tiago 1:5;Tiago 4:8;1 Pedro 5:7;1 João 1:9;1 João 4:8;Apocalipse 3:20;Apocalipse 21:4';
function vdRef(){var l=VD.split(';'),d=new Date(),n=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5),m=l[n%l.length].match(/^(.+) (\d+):(\d+)$/),bi=-1;
  ALL.forEach(function(b,i){if(b[0]===m[1])bi=i});return{b:bi,c:+m[2],v:+m[3],t:m[0]}}
function fillVd(){var box=document.getElementById('vd');if(!box)return;var r=vdRef(),id=verPrincipal();
  function paint(txt,nome){VDT=txt?'“'+txt+'”\n— '+r.t+(nome?' ('+nome+')':'')+(embutida(id)?'\n'+credCurtoTxt():''):'';
    box.innerHTML='<div class="vodr">Versículo do dia</div>'+(txt?'<div class="vodt">'+esc(txt)+'</div>':'<p style="margin:8px 0 0;color:var(--onc2)">Para ver o texto aqui, instale uma versão em Bíblia → Versões.</p>')+
    '<div class="vodf"><span><b>'+esc(r.t)+'</b>'+(nome?' <small>· '+esc(nome)+'</small>':'')+'</span><span class="row" style="gap:6px">'+(txt?'<button class="pill" onclick="vdShare()">Compartilhar</button>':'')+'<button class="pill" onclick="abrirVd()">Abrir capítulo →</button></span></div>'+(txt&&embutida(id)?'<div style="margin-top:10px;font-size:.7rem;color:var(--onc2)">JFAAL, © Marcos Cristiano Alves Ferreira (2024) · <a href="'+JFAAL.lic+'" target="_blank" rel="noopener" style="color:var(--acc2)">CC BY 3.0 BR</a> · <a href="#" onclick="creditos(event);return false" style="color:var(--acc2)">créditos</a></div>':'')}
  if(!id){paint();return}
  getVers(id).then(function(L){var c=L&&L[r.b]&&L[r.b][r.c-1],m=VMETA.filter(function(x){return x.id===id})[0];paint(c&&c[r.v-1],m&&m.nome)}).catch(function(){paint()})}
var VDT='';
function vdShare(){if(!VDT)return;if(navigator.share)navigator.share({text:VDT}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(VDT).then(function(){toast('Versículo copiado.')});else prompt('Copie o texto:',VDT)}
function abrirVd(){var r=vdRef();S.book=r.b;S.chap=r.c;S.verse=r.v;S.cmp=false;S.bt='ler';go('biblia')}
var ABR='Gn,Êx,Lv,Nm,Dt,Js,Jz,Rt,1Sm,2Sm,1Rs,2Rs,1Cr,2Cr,Ed,Ne,Et,Jó,Sl,Pv,Ec,Ct,Is,Jr,Lm,Ez,Dn,Os,Jl,Am,Ob,Jn,Mq,Na,Hc,Sf,Ag,Zc,Ml,Mt,Mc,Lc,Jo,At,Rm,1Co,2Co,Gl,Ef,Fp,Cl,1Ts,2Ts,1Tm,2Tm,Tt,Fm,Hb,Tg,1Pe,2Pe,1Jo,2Jo,3Jo,Jd,Ap'.split(',');
function norm(t){return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'')}
function filtraLv(){var el=document.getElementById('bq'),box=document.getElementById('lv');if(!el||!box)return;
  var q=norm(el.value.replace(/([^\d\s:.,])\s*[\d:.,]+$/,'$1')),h='';
  ALL.forEach(function(b,i){if(!q||norm(ABR[i]).indexOf(q)===0||norm(b[0]).indexOf(q)>-1)h+='<div class="chip sm'+(S.book===i?' on':'')+'" title="'+esc(b[0])+'" onclick="pickBook('+i+')">'+ABR[i]+'</div>'});
  box.innerHTML=h||'<span class="tag">Nenhum livro encontrado.</span>';box.style.display=''}
function irBusca(){var t=document.getElementById('bq').value.trim(),m=t.match(/^(.*?)\s*(?:(\d+)(?:\s*[:.,]\s*(\d+))?)?$/)||[],nm=norm(m[1]||''),b=S.book,i;
  if(nm){b=bookIdx(m[1]);
    for(i=0;i<ALL.length&&b<0;i++)if(norm(ALL[i][0]).indexOf(nm)===0)b=i;
    if(m[2])for(i=0;i<ALL.length&&b<0;i++)if(norm(ALL[i][0]).indexOf(nm)>-1)b=i;
    if(b<0){if(!m[2]){S.bq=t;S.bt='busca';biblia();fazBusca();return}toast('Livro não encontrado.');return}}
  if(b===null){toast('Escolha um livro.');return}
  var c=+(m[2]||document.getElementById('bc').value)||1,vv=+(m[2]?m[3]:document.getElementById('bv').value)||null;
  if(c>ALL[b][1]){toast(ALL[b][0]+' tem '+ALL[b][1]+' capítulos.');return}
  S.book=b;S.chap=c;S.verse=vv;biblia();window.scrollTo(0,0)}

/* Anotações (de versículo, de um trecho de versículos ou do capítulo) */
function listaAnot(){var it=[];
  (DATA.anot||[]).forEach(function(x){it.push({k:'v',id:x.id,b:x.b,c:x.c,v:x.v,e:x.e||0,t:x.t})});
  Object.keys(DATA.notes||{}).forEach(function(k){var m=k.match(/^(.+) (\d+)$/),b=-1;if(!m||!String(DATA.notes[k]).trim())return;ALL.forEach(function(x,i){if(x[0]===m[1])b=i});if(b>=0)it.push({k:'c',id:k,b:b,c:+m[2],v:0,e:0,t:DATA.notes[k]})});
  it.sort(function(x,y){return x.b-y.b||x.c-y.c||x.v-y.v});return it}
function refA(x){return ALL[x.b][0]+' '+x.c+(x.k==='v'?':'+x.v+(x.e?'-'+x.e:''):' (capítulo)')}
function anotView(){var e=S.ed,h='<div class="row" style="margin-bottom:12px"><input id="aq" placeholder="Buscar nas anotações…" oninput="drawAnot()" style="flex:1;margin:0;min-width:0"><button class="btn" onclick="novaAnot()">+ Nova</button></div>';
  if(e){var op=ALL.map(function(b,i){return '<option value="'+i+'"'+(i===e.b?' selected':'')+'>'+esc(b[0])+'</option>'}).join('');
    h+='<div class="card"><h3>'+(e.orig?'Editar anotação':'Nova anotação')+'</h3><div class="row" style="flex-wrap:nowrap"><select id="eb" style="flex:2;min-width:0">'+op+'</select><input id="ec" type="number" min="1" inputmode="numeric" placeholder="Cap." value="'+esc(e.c)+'" style="flex:.8;min-width:0"><input id="ev" type="number" min="1" inputmode="numeric" placeholder="Vers." value="'+esc(e.v)+'" style="flex:.8;min-width:0"><input id="ee" type="number" min="1" inputmode="numeric" placeholder="até" value="'+esc(e.e)+'" style="flex:.8;min-width:0"></div><p class="tag" style="margin:2px 0">Deixe o versículo em branco para anotar o capítulo inteiro. Use “até” para um trecho (ex.: 16 até 18).</p><textarea id="et" placeholder="Sua anotação…">'+esc(e.t)+'</textarea><div class="row"><button class="btn" onclick="saveAnot()">Salvar</button><button class="btn ghost" onclick="S.ed=null;biblia()">Cancelar</button></div></div>'}
  return h+'<div id="al"></div>'}
function novaAnot(b,c,vv,ee){b=b==null?(S.book!==null?S.book:0):b;c=c||S.chap||1;ee=ee&&ee>vv?ee:0;var x=vv?anotV(b,c,vv,ee):null,t=vv?(x?x.t:''):(DATA.notes||{})[ALL[b][0]+' '+c]||'';
  S.ed={b:b,c:c,v:vv||'',e:ee||'',t:t,orig:x?{k:'v',id:x.id}:null};S.bt='anot';biblia();window.scrollTo(0,0)}
function editAnot(k,id){var x=listaAnot().filter(function(y){return y.k===k&&y.id===id})[0];if(!x)return;S.ed={b:x.b,c:x.c,v:x.v||'',e:x.e||'',t:x.t,orig:{k:k,id:id}};biblia();window.scrollTo(0,0)}
function rmAnot(k,id){if(k==='v')save('anot',(DATA.anot||[]).filter(function(x){return x.id!==id}));else{var n=Object.assign({},DATA.notes);delete n[id];save('notes',n)}}
function saveAnot(){var b=+v('eb'),c=+v('ec'),vv=+v('ev')||0,ee=+v('ee')||0,t=v('et');
  if(!c||c<1||c>ALL[b][1]){toast(ALL[b][0]+' tem '+ALL[b][1]+' capítulos.');return}
  if(!t.trim()){toast('Escreva a anotação.');return}
  if(ee&&vv&&ee<vv){var tq=ee;ee=vv;vv=tq}if(!vv||ee===vv)ee=0;
  if(S.ed&&S.ed.orig)rmAnot(S.ed.orig.k,S.ed.orig.id);
  if(vv){var l=(DATA.anot||[]).filter(function(x){return !(x.b===b&&x.c===c&&x.v===vv&&(x.e||0)===ee)}),o={id:'a'+Date.now(),b:b,c:c,v:vv,t:t,d:iso(new Date())};if(ee)o.e=ee;l.push(o);save('anot',l)}
  else{var n=Object.assign({},DATA.notes);n[ALL[b][0]+' '+c]=t;save('notes',n)}
  S.ed=null;toast('Anotação salva.');biblia()}
function drawAnot(){var box=document.getElementById('al');if(!box)return;var q=norm(document.getElementById('aq').value||''),it=listaAnot().filter(function(x){return !q||norm(refA(x)+x.t).indexOf(q)>-1});
  box.innerHTML=it.length?'<div class="card" style="padding:4px 14px">'+it.map(function(x){var key=x.k+'|'+x.id,ab=S.ao===key,t=String(x.t||'');
    return '<div class="item" style="display:block" onclick="togAo(\''+esc(key)+'\')"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="min-width:0"><b class="cref" style="font-size:.95rem">'+esc(refA(x))+'</b>'+
      (ab?'':'<br><small style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(t.replace(/\s+/g,' ').slice(0,140))+'</small>')+'</div><span class="chev">'+(ab?'⌄':'›')+'</span></div>'+
      (ab?'<div onclick="event.stopPropagation()" style="cursor:auto"><p style="white-space:pre-wrap;margin:.5em 0 0">'+esc(t)+'</p><div class="ca"><button class="btn ghost" onclick="abrirAnot('+x.b+','+x.c+','+x.v+')">Abrir na Bíblia</button><button class="btn ghost" onclick="editAnot(\''+x.k+'\',\''+esc(x.id)+'\')">Editar</button><button class="btn ghost danger" onclick="delAnot(\''+x.k+'\',\''+esc(x.id)+'\')">Excluir</button></div></div>':'')+'</div>'}).join('')+'</div>':vazio(q?'Nada encontrado.':'Nenhuma anotação ainda. Toque em “+ Nova” ou, na aba Ler, toque nos versículos e em “📝 Anotar”.')}
function togAo(k){S.ao=S.ao===k?null:k;drawAnot()}
function abrirAnot(b,c,v){S.book=b;S.chap=c;S.verse=v||null;S.cmp=false;S.bt='ler';biblia();window.scrollTo(0,0)}
function delAnot(k,id){if(!confirm('Excluir esta anotação?'))return;rmAnot(k,id);drawAnot()}

/* Versões bíblicas: colunas independentes (versão, livro, capítulo e versículo por coluna) */
function ex(id){return VMETA.some(function(m){return m.id===id})}
function panesLoad(){try{var c=JSON.parse(LS.getItem('cmp'));if(c&&c.panes&&c.panes.length){S.cmp=!!c.on;S.panes=c.panes}}catch(e){}}
function panesSave(){try{LS.setItem('cmp',JSON.stringify({on:!!S.cmp,panes:S.panes||[]}))}catch(e){}}
function togPanes(){if(S.cmp){S.cmp=false}else{
    var a=verAtiva(),b=S.book!==null?S.book:0,c=S.chap||1,o=VMETA.filter(function(m){return m.id!==a})[0];
    if(!S.panes||!S.panes.length)S.panes=[{v:a,b:b,c:c,vs:S.verse||null},{v:o?o.id:a,b:b,c:c,vs:S.verse||null}];S.cmp=true}
  panesSave();biblia()}
function addPane(){if(S.panes.length>=3){toast('Até 3 colunas.');return}var l=S.panes[S.panes.length-1],o=VMETA.filter(function(m){return m.id!==l.v})[0];
  S.panes.push({v:o?o.id:l.v,b:l.b,c:l.c,vs:l.vs});panesSave();biblia()}
function delPane(i){S.panes.splice(i,1);panesSave();biblia()}
function paneSet(i,k,val){var p=S.panes[i];
  if(k==='b'){p.b=val;p.c=1;p.vs=null;panesSave();biblia();return}
  if(k==='c'){if(!val||val<1||val>ALL[p.b][1]){toast(ALL[p.b][0]+' tem '+ALL[p.b][1]+' capítulos.');biblia();return}p.c=val;panesSave();biblia();return}
  p[k]=val;panesSave();paintPane(i)}
function paneStep(i,d){var p=S.panes[i],n=p.c+d;p.vs=null;
  if(n>ALL[p.b][1]){if(p.b>=ALL.length-1)return;p.b++;n=1}else if(n<1){if(p.b<=0)return;p.b--;n=ALL[p.b][1]}
  p.c=n;panesSave();biblia()}
function panesView(c){var P=S.panes||[];
  return '<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>Versões bíblicas</b>'+(P.length<3?'<button class="btn ghost" onclick="addPane()">+ Coluna</button>':'')+'</div>'+
    '<div class="panes" style="--n:'+P.length+'">'+P.map(function(p,i){return paneHtml(p,i,c)}).join('')+'</div>'}
function paneHtml(p,i,c){
  var vo=VMETA.map(function(m){return '<option value="'+m.id+'"'+(m.id===p.v?' selected':'')+'>'+esc(c.full?(m.completo||m.nome):m.nome)+'</option>'}).join(''),
      bo=ALL.map(function(b,k){return '<option value="'+k+'"'+(k===p.b?' selected':'')+'>'+esc(b[0])+'</option>'}).join('');
  return '<div class="pane"><div class="panehd"><div class="row" style="flex-wrap:nowrap"><select onchange="paneSet('+i+',\'v\',this.value)" style="flex:1;min-width:0">'+(vo||'<option>Sem versões</option>')+'</select>'+(S.panes.length>1?'<button class="btn ghost" title="Remover coluna" onclick="delPane('+i+')">✕</button>':'')+'</div>'+
    '<select onchange="paneSet('+i+',\'b\',+this.value)">'+bo+'</select>'+
    '<div class="row" style="flex-wrap:nowrap"><button class="btn ghost" onclick="paneStep('+i+',-1)">‹</button><input type="number" min="1" inputmode="numeric" placeholder="Cap." value="'+p.c+'" onchange="paneSet('+i+',\'c\',+this.value)" style="min-width:0"><input type="number" min="1" inputmode="numeric" placeholder="Vers." value="'+(p.vs||'')+'" onchange="paneSet('+i+',\'vs\',+this.value||null)" style="min-width:0"><button class="btn ghost" onclick="paneStep('+i+',1)">›</button></div></div>'+
    '<div class="panetx'+(c.par?' par':'')+'" id="pnt'+i+'" style="font-size:'+c.fs+'px;line-height:'+c.lh+'"></div></div>'}
function paintPane(i){var p=S.panes[i],box=document.getElementById('pnt'+i),c=lcfg();if(!box)return;
  if(!p.v||!ex(p.v)){box.innerHTML='<p class="tag" style="text-align:center">Nenhuma versão instalada.<br>Importe uma na aba “Versões”.</p>';return}
  getVers(p.v).then(function(L){var vs=L&&L[p.b]&&L[p.b][p.c-1]||[],k;
    if(!vs.length){box.innerHTML='<p class="tag" style="text-align:center">Sem texto para '+esc(ALL[p.b][0])+' '+p.c+' nesta versão.</p>';return}
    var an={};(DATA.anot||[]).forEach(function(x){if(x.b===p.b&&x.c===p.c)for(k=x.v;k<=(x.e||x.v);k++)an[k]=1});
    box.innerHTML=vs.map(function(t,k){return '<p id="p'+i+'v'+(k+1)+'" class="vr'+(p.vs===k+1?' vhl':'')+'" style="cursor:default">'+(c.nums?'<b class="vn" style="cursor:pointer" title="Anotar este versículo" onclick="novaAnot('+p.b+','+p.c+','+(k+1)+')">'+(k+1)+'</b> ':'')+esc(t)+(an[k+1]?' <span class="mk">📝</span>':'')+'</p>'}).join('')+(embutida(p.v)?credCurto():'');
    if(p.vs){var el=document.getElementById('p'+i+'v'+p.vs);if(el)el.scrollIntoView({block:'nearest',behavior:'smooth'})}
  }).catch(function(){box.innerHTML='<p class="tag">Não foi possível carregar a versão.</p>'})}
function paintPanes(){(S.panes||[]).forEach(function(p,i){paintPane(i)})}
panesLoad();
bkIniciar();
render('home');
loadMeta().then(instalaJfaal);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
pull();setInterval(pull,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)pull()});
</script>
